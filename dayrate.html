<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Day Rating Calendar</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background: #f3f4f6; color: #1f2937; }
    .app { max-width: 800px; margin: auto; padding: 20px; background: white; border-radius: 16px; box-shadow: 0 8px 30px #00000012; }
    h1 { margin: 0 0 20px; text-align: center; }
    .month-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .month-controls button, .action { border: 0; border-radius: 9px; padding: 11px 16px; cursor: pointer; font-size: 16px; }
    .month-controls button { background: #e5e7eb; font-size: 20px; }
    .month-controls button:hover { background: #d1d5db; }
    #monthTitle { font-size: 24px; font-weight: 700; text-align: center; }
    .weekdays, .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    .weekday { padding: 8px 0; text-align: center; font-weight: 700; color: #6b7280; }
    .day { min-height: 76px; padding: 8px; border: 1px solid #d1d5db; border-radius: 10px; background: white; cursor: pointer; text-align: left; color: inherit; }
    .day:hover { border-color: #2563eb; background: #eff6ff; }
    .day.selected { outline: 3px solid #93c5fd; border-color: #2563eb; }
    .day-number { font-weight: 700; }
    .rating { margin-top: 10px; font-weight: 700; color: #2563eb; overflow-wrap: anywhere; }
    .empty { min-height: 76px; }
    #ratingPanel { display: none; margin-top: 24px; padding: 20px; background: #f3f4f6; border-radius: 12px; }
    #ratingPanel h2 { margin: 0 0 14px; font-size: 20px; }
    #ratingInput { width: 100%; margin-top: 8px; padding: 12px; border: 1px solid #9ca3af; border-radius: 8px; font-size: 18px; }
    .action { width: 100%; margin-top: 10px; background: #2563eb; color: white; }
    .action:hover { background: #1d4ed8; }
    .remove { margin-top: 8px; border: 1px solid #cbd5e1; background: white; color: #374151; }
    .remove:hover { background: #f8fafc; }
    #message { min-height: 22px; margin-top: 9px; color: #166534; }
    #message.error { color: #b91c1c; }
    .storage-note { margin: 10px 0 0; color: #6b7280; font-size: 13px; text-align: center; }
    @media (max-width: 500px) {
      body { padding: 8px; }
      .app { padding: 12px; }
      h1 { font-size: 24px; }
      #monthTitle { font-size: 18px; }
      .day, .empty { min-height: 60px; }
      .day { padding: 5px; }
      .weekday, .rating { font-size: 11px; }
      .rating { margin-top: 6px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>My Day Ratings</h1>
    <div class="month-controls">
      <button id="previousMonth" type="button" aria-label="Previous month">←</button>
      <div id="monthTitle"></div>
      <button id="nextMonth" type="button" aria-label="Next month">→</button>
    </div>
    <div class="weekdays" aria-hidden="true">
      <div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div>
      <div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div>
      <div class="weekday">Sat</div>
    </div>
    <div id="calendar" class="calendar"></div>

    <section id="ratingPanel">
      <h2 id="selectedDate"></h2>
      <label for="ratingInput">Enter any number, including a decimal:</label>
      <input id="ratingInput" type="number" step="any" inputmode="decimal" placeholder="Example: 8.5">
      <button id="saveRating" class="action" type="button">Save Rating</button>
      <button id="removeRating" class="action remove" type="button">Remove Rating</button>
      <div id="message" role="status" aria-live="polite"></div>
    </section>
    <p class="storage-note">Ratings are saved automatically in this browser on this device.</p>
  </main>

  <script>
    const STORAGE_KEY = "dayRatingCalendar.ratings.v1";
    let currentDate = new Date();
    currentDate.setDate(1);
    let selectedDate = null;
    let ratings = loadRatings();

    const calendar = document.getElementById("calendar");
    const monthTitle = document.getElementById("monthTitle");
    const ratingPanel = document.getElementById("ratingPanel");
    const selectedDateText = document.getElementById("selectedDate");
    const ratingInput = document.getElementById("ratingInput");
    const message = document.getElementById("message");

    function loadRatings() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const parsed = saved ? JSON.parse(saved) : {};
        return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    function persistRatings() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(ratings));
        return true;
      } catch (error) {
        showMessage("This browser could not save the ratings permanently.", true);
        return false;
      }
    }

    function getDateKey(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
    }

    function drawCalendar() {
      calendar.innerHTML = "";
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      monthTitle.textContent = currentDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "empty";
        calendar.appendChild(empty);
      }

      for (let dayNumber = 1; dayNumber <= daysInMonth; dayNumber++) {
        const dateKey = getDateKey(year, month, dayNumber);
        const day = document.createElement("button");
        day.type = "button";
        day.className = `day${selectedDate === dateKey ? " selected" : ""}`;
        day.setAttribute("aria-label", `${dateKey}${ratings[dateKey] !== undefined ? `, rating ${ratings[dateKey]}` : ""}`);

        const number = document.createElement("div");
        number.className = "day-number";
        number.textContent = dayNumber;
        const rating = document.createElement("div");
        rating.className = "rating";
        rating.textContent = ratings[dateKey] !== undefined ? `★ ${ratings[dateKey]}` : "";
        day.append(number, rating);
        day.addEventListener("click", () => selectDay(dateKey, year, month, dayNumber));
        calendar.appendChild(day);
      }
    }

    function selectDay(dateKey, year, month, day) {
      selectedDate = dateKey;
      ratingPanel.style.display = "block";
      selectedDateText.textContent = new Date(year, month, day).toLocaleDateString(undefined, {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
      });
      ratingInput.value = ratings[dateKey] ?? "";
      showMessage("");
      drawCalendar();
      ratingInput.focus();
    }

    function saveSelectedRating() {
      if (!selectedDate) return showMessage("Please select a day first.", true);
      const value = ratingInput.value.trim();
      if (value === "") return showMessage("Please enter a number.", true);
      const number = Number(value);
      if (!Number.isFinite(number)) return showMessage("Please enter a valid number.", true);
      ratings[selectedDate] = number;
      if (persistRatings()) showMessage("Rating saved permanently.");
      drawCalendar();
    }

    document.getElementById("saveRating").addEventListener("click", saveSelectedRating);
    document.getElementById("removeRating").addEventListener("click", () => {
      if (!selectedDate) return;
      delete ratings[selectedDate];
      ratingInput.value = "";
      if (persistRatings()) showMessage("Rating removed.");
      drawCalendar();
    });
    ratingInput.addEventListener("keydown", event => {
      if (event.key === "Enter") saveSelectedRating();
    });
    document.getElementById("previousMonth").addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
      drawCalendar();
    });
    document.getElementById("nextMonth").addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
      drawCalendar();
    });

    drawCalendar();
  </script>
</body>
</html>
